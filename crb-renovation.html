<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CRB Rénovation — Rénovation d'appartements et de maisons à Marseille</title>
<meta name="description" content="CRB, spécialiste de la rénovation d'appartements et de maisons à Marseille. Travaux clé en main, devis gratuit.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500&family=Manrope:wght@400;500&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;overflow-x:hidden}
body{background:#fff;font-family:Archivo,"Helvetica Neue",Helvetica,sans-serif;color:#fff;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid #fff;outline-offset:3px}
img{max-width:100%}

/* ---------- PAGE BACKGROUND ---------- */
.page{position:relative;overflow:hidden;
  background:linear-gradient(180deg,#1150ef 0%,#135af3 30%,#3c7af6 52%,#76a2fa 64%,#86acfb 70%,#b9cffd 84%,#fff 100%)}
.page::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(40% 18% at 30% 12%,rgba(120,170,255,.35),transparent 70%),
    radial-gradient(35% 14% at 78% 26%,rgba(130,175,255,.28),transparent 70%),
    radial-gradient(30% 10% at 55% 3%,rgba(110,160,255,.3),transparent 70%)}
.gl{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.28);z-index:0;pointer-events:none;
  transform-origin:top;animation:lineGrow 1.6s cubic-bezier(.65,0,.35,1) both}
.gl:nth-child(1){left:4.8%;animation-delay:0s}
.gl:nth-child(2){left:35.45%;animation-delay:.1s}
.gl:nth-child(3){left:64.7%;animation-delay:.2s}
.gl:nth-child(4){left:95.2%;animation-delay:.3s}
@keyframes lineGrow{from{transform:scaleY(0)}to{transform:scaleY(1)}}

/* ---------- HERO ---------- */
.hero{position:relative;overflow:hidden;min-height:clamp(760px,75vw,1300px);display:flex;flex-direction:column}
.house{position:absolute;right:4.8vw;bottom:0;width:max(83vw,640px);height:auto;z-index:1;pointer-events:none;
  animation:houseRise 4.2s cubic-bezier(.22,.61,.24,1) .2s both}
@keyframes houseRise{
  0%{opacity:0;transform:translateY(70%) scale(1.06)}
  25%{opacity:1}
  100%{opacity:1;transform:translateY(0) scale(1)}}

/* ---------- HEADER ---------- */
.header{position:relative;z-index:10;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;
  padding:24px clamp(16px,2.2vw,40px) 0}
.logo{grid-column:1;justify-self:start;display:flex;align-items:center;gap:10px}
.logo svg{width:40px;height:30px;display:block}
.nav{grid-column:2;display:flex;gap:1px}
.pill{height:40px;padding:0 18px;border-radius:999px;font-size:13px;letter-spacing:-.035em;display:inline-flex;align-items:center;gap:10px;
  white-space:nowrap;border:0;transition:background .3s,color .3s}
.pill.glass{background:rgba(255,255,255,.16);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.pill.glass:hover{background:rgba(255,255,255,.3)}
.pill.solid{background:#fff;color:#161616}
.pill svg{width:15px;height:15px;flex:none}
.right{grid-column:3;justify-self:end;display:flex;align-items:center;gap:10px}
.lang{height:40px;display:flex;align-items:center;padding:3px;gap:2px;border-radius:999px;background:rgba(255,255,255,.16);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.lang button{height:34px;min-width:40px;padding:0 12px;border-radius:999px;border:0;background:transparent;color:#fff;font-size:13px;letter-spacing:-.035em;transition:background .3s,color .3s}
.lang button[aria-pressed="true"]{background:#fff;color:#161616}
.cta{height:41px;padding:0 19px;border-radius:999px;border:1px solid rgba(255,255,255,.9);display:inline-flex;align-items:center;
  font-size:13px;letter-spacing:-.035em;white-space:nowrap;transition:background .3s,color .3s}
.cta:hover{background:#fff;color:#1150ef}
.burger{display:none;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.16);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);align-items:center;justify-content:center}
.burger span{display:block;width:16px;height:1.5px;background:#fff;position:relative;transition:background .3s}
.burger span::before,.burger span::after{content:"";position:absolute;left:0;width:16px;height:1.5px;background:#fff;transition:transform .35s cubic-bezier(.2,.7,.2,1)}
.burger span::before{top:-5px}.burger span::after{top:5px}
.burger[aria-expanded="true"] span{background:transparent}
.burger[aria-expanded="true"] span::before{transform:translateY(5px) rotate(45deg)}
.burger[aria-expanded="true"] span::after{transform:translateY(-5px) rotate(-45deg)}
.dropdown{position:absolute;top:78px;right:clamp(16px,2.2vw,40px);width:min(320px,calc(100% - 2*clamp(16px,2.2vw,40px)));
  display:flex;flex-direction:column;gap:6px;padding:10px;border-radius:24px;background:rgba(255,255,255,.18);
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.3);
  opacity:0;visibility:hidden;transform:translateY(-8px) scale(.98);transform-origin:top right;
  transition:opacity .35s,transform .35s cubic-bezier(.2,.7,.2,1),visibility .35s}
.dropdown.open{opacity:1;visibility:visible;transform:none}
.dropdown .pill{height:48px;justify-content:flex-start;padding:0 20px;font-size:14px}

.fd{animation:fadeDown .8s cubic-bezier(.2,.7,.2,1) both}
@keyframes fadeDown{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}

/* ---------- WORDS ---------- */
.w{display:inline-block;animation-name:wordIn;animation-timing-function:cubic-bezier(.2,.7,.2,1);animation-fill-mode:both}
@keyframes wordIn{from{opacity:0;transform:translateY(.45em);filter:blur(10px)}to{opacity:1;transform:none;filter:blur(0)}}
.ln{display:block}

/* ---------- HEADLINE ---------- */
.headline{position:relative;z-index:3;display:flex;flex-wrap:wrap;column-gap:24px;align-items:flex-start;
  padding:clamp(28px,3.4vw,60px) clamp(16px,2.2vw,40px) 0}
h1{margin:0;font-family:"Playfair Display",Georgia,serif;font-weight:400;text-transform:uppercase;
  font-size:min(clamp(40px,calc(39px + 4.9vw),170px),calc((100vw - 32px)/6.8));line-height:.87;letter-spacing:-.005em}
h1 .ln:first-child{padding-left:.92em}
.tagline{margin:clamp(24px,4.3vw,80px) 0 0 auto;font-size:clamp(13px,1.66vw,26px);line-height:1.02;letter-spacing:-.045em;text-transform:uppercase;font-weight:400}
.tagline .ln:first-child{padding-left:3.6em}

/* ---------- EXPLORE ---------- */
.explore-row{position:relative;z-index:3;padding:clamp(36px,5.6vw,100px) clamp(16px,2.2vw,40px) 0}
.explore{display:inline-flex;align-items:center;gap:clamp(18px,2.4vw,34px);font-size:clamp(13px,1.3vw,20px);letter-spacing:-.01em;
  text-transform:uppercase;transition:opacity .3s}
.explore:hover{opacity:.8}
.explore svg{width:18px;height:18px}

/* ---------- VIDEO CARD ---------- */
.vcard{position:absolute;left:clamp(16px,2.2vw,40px);bottom:clamp(36px,8.6vw,140px);width:clamp(150px,17vw,290px);z-index:3;
  animation:cardIn 1s cubic-bezier(.2,.7,.2,1) 2s both}
@keyframes cardIn{from{opacity:0;transform:translateY(30px) scale(.97)}to{opacity:1;transform:none}}
.vbox{aspect-ratio:1.7;border-radius:clamp(8px,.9vw,14px);overflow:hidden;background:rgba(255,255,255,.2)}
.vbox video{width:100%;height:100%;object-fit:cover;display:block}
.caption{margin:8px 0 0;font-family:Manrope,"Helvetica Neue",sans-serif;font-size:clamp(13px,1.4vw,22px);line-height:1.02;letter-spacing:.035em}
.bars{margin-top:12px;display:flex;gap:5px;transform-origin:left;animation:barsIn .9s cubic-bezier(.2,.7,.2,1) 2.55s both}
@keyframes barsIn{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.bar{flex:1;height:14px;display:flex;align-items:center;padding:0;border:0;background:none;transition:flex .6s cubic-bezier(.2,.7,.2,1)}
.bar i{display:block;width:100%;height:3px;border-radius:2px;background:rgba(255,255,255,.4);transition:background .6s}
.bar.active{flex:1.7}.bar.active i{background:#fff}

/* ---------- SECTIONS ---------- */
.sec{position:relative;z-index:2;display:flex;flex-wrap:wrap;row-gap:32px;
  padding:clamp(56px,9.9vw,170px) clamp(16px,4vw,70px) clamp(40px,4.4vw,80px) clamp(16px,2.8vw,48px)}
.sec h2{flex:1 1 max(200px,24.5vw);margin:clamp(0px,.9vw,16px) 0 0;font-family:"Playfair Display",Georgia,serif;font-weight:400;
  font-size:clamp(40px,4.6vw,80px);line-height:1.2;color:#0d0d0d}
.sec h2 .w{text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:.06em;animation:none;opacity:0}
.sec.in h2 .w{animation-name:wordIn;opacity:1}
.item{margin:0;opacity:0;scroll-snap-align:start;min-width:0}
.sec.in .item{animation:cardIn 1.1s cubic-bezier(.2,.7,.2,1) both}
.sec.in .item:nth-child(1){animation-delay:.2s}
.sec.in .item:nth-child(2){animation-delay:.35s}
.sec.in .item:nth-child(3){animation-delay:.5s}
.sec.in .item:nth-child(4){animation-delay:.65s}
.sec.in .item:nth-child(5){animation-delay:.8s}
.sec.in .item:nth-child(6){animation-delay:.95s}
.card{aspect-ratio:.79;border-radius:clamp(6px,.8vw,12px);overflow:hidden;background:rgba(255,255,255,.3)}
.card img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 1s cubic-bezier(.2,.7,.2,1)}
.item:hover .card img{transform:scale(1.05)}
.item figcaption{margin-top:10px;font-family:Manrope,"Helvetica Neue",sans-serif;font-size:clamp(13px,1vw,16px);letter-spacing:.02em;color:#0d0d0d}

/* Réalisations */
.gallery{flex:999 1 540px;min-width:0;display:grid;grid-template-columns:repeat(3,minmax(170px,1fr));gap:clamp(18px,2vw,32px) clamp(10px,1.25vw,20px);
  overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.gallery::-webkit-scrollbar{display:none}

/* Savoir-faire */
.services{padding-top:clamp(24px,4vw,70px)}
.svc-grid{flex:999 1 540px;min-width:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:clamp(20px,2vw,32px) clamp(10px,1.25vw,20px)}
.svc-grid .card{aspect-ratio:1.25}
.svc-grid h3{margin:16px 0 6px;font-family:"Playfair Display",Georgia,serif;font-weight:400;font-size:clamp(22px,1.8vw,30px);line-height:1.1;color:#0d0d0d}
.svc-grid p{margin:0;max-width:34ch;font-family:Manrope,"Helvetica Neue",sans-serif;font-size:clamp(14px,1vw,16px);line-height:1.5;color:#33363d}

/* ---------- RESPONSIVE ---------- */
@media (max-width:860px){
  .nav{display:none}
  .burger{display:inline-flex}
}
@media (max-width:420px){
  .right{gap:6px}
  .cta{padding:0 13px;font-size:12px}
  .lang button{min-width:34px;padding:0 9px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}
  .sec h2 .w,.item{opacity:1}
}
</style>
</head>

  function renderWords(el, lines){
    var start = parseFloat(el.dataset.start), step = parseFloat(el.dataset.step), dur = el.dataset.dur;
    var i = 0; el.innerHTML = "";
    el.setAttribute("aria-label", lines.join(" "));
    lines.forEach(function(line){
      var ln = document.createElement("span"); ln.className = "ln"; ln.setAttribute("aria-hidden","true");
      line.split(" ").forEach(function(word, k){
        if(k) ln.appendChild(document.createTextNode(" "));
        var w = document.createElement("span"); w.className = "w"; w.textContent = word;
        w.style.animationDuration = dur + "s";
        w.style.animationDelay = (start + step * i++).toFixed(2) + "s";
        ln.appendChild(w);
      });
      el.appendChild(ln);
    });
  }

  function setLang(lang, first){
    var d = T[lang]; document.documentElement.lang = lang;
    document.querySelectorAll("[data-i18n]").forEach(function(el){ el.textContent = d[el.dataset.i18n]; });
    document.querySelectorAll("[data-words]").forEach(function(el){
      // on switch, replay text quickly instead of the full load timeline
      if(!first && !el.closest(".sec")){ el.dataset.start = "0"; }
      renderWords(el, d[el.dataset.words]);
    });
    document.querySelectorAll("[data-lang]").forEach(function(b){ b.setAttribute("aria-pressed", String(b.dataset.lang === lang)); });
  }
  setLang("fr", true);
  document.querySelectorAll("[data-lang]").forEach(function(b){
    b.addEventListener("click", function(){ if(b.getAttribute("aria-pressed") !== "true") setLang(b.dataset.lang, false); });
  });

  // Burger menu
  var burger = document.querySelector(".burger"), menu = document.getElementById("menu");
  function toggle(open){ menu.classList.toggle("open", open); burger.setAttribute("aria-expanded", String(open)); }
  burger.addEventListener("click", function(e){ e.stopPropagation(); toggle(!menu.classList.contains("open")); });
  menu.addEventListener("click", function(e){ if(e.target.closest("a")) toggle(false); });
  document.addEventListener("click", function(e){ if(!menu.contains(e.target)) toggle(false); });
  document.addEventListener("keydown", function(e){ if(e.key === "Escape") toggle(false); });
  window.addEventListener("resize", function(){ if(innerWidth > 860) toggle(false); });

  // Video that never stops
  var v = document.getElementById("vid");
  function play(){ var p = v.play(); if(p && p.catch) p.catch(function(){}); }
  ["pause","ended","stalled"].forEach(function(ev){ v.addEventListener(ev, function(){ setTimeout(play, 60); }); });
  setInterval(function(){ if(v.paused) play(); }, 1000);
  document.addEventListener("visibilitychange", function(){ if(!document.hidden) play(); });
  ["pointerdown","touchstart"].forEach(function(ev){ window.addEventListener(ev, play, {once:true, passive:true}); });
  play();

  // Progress bars
  var bars = Array.prototype.slice.call(document.querySelectorAll(".bar")), current = 0;
  function setActive(i){ if(i === current) return; current = i; bars.forEach(function(b, k){ b.classList.toggle("active", k === i); }); }
  v.addEventListener("timeupdate", function(){
    if(!v.duration || !isFinite(v.duration)) return;
    setActive(Math.min(3, Math.floor(v.currentTime / v.duration * 4)));
  });
  bars.forEach(function(b, i){
    b.addEventListener("click", function(){
      if(v.duration && isFinite(v.duration)) v.currentTime = v.duration * i / 4 + 0.01;
      setActive(i); play();
    });
  });

  // Scroll reveal for sections
  var secs = document.querySelectorAll(".sec");
  if("IntersectionObserver" in window){
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(en){ if(en.isIntersecting){ en.target.classList.add("in"); io.unobserve(en.target); } });
    }, {threshold:.15});
    secs.forEach(function(el){ io.observe(el); });
  } else { secs.forEach(function(el){ el.classList.add("in"); }); }
})();
</script>
</body>
</html>
